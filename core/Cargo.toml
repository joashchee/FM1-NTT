[package]
name = "fm1ntt-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "FM1-NTT core: a sandbox for FM-1 firmware. Wraps the vendored fm1-emu crates (MIT) in a deterministic machine and a C API."

[lib]
name = "fm1ntt"
crate-type = ["rlib", "staticlib"]

# The only dependencies are the three vendored crates (vendor/fm1-emu/VENDORED.md): MIT, no dependencies of their own.
[dependencies]
fm1-core = { path = "vendor/fm1-emu/crates/fm1-core" }
fm1-soc = { path = "vendor/fm1-emu/crates/fm1-soc" }

# A debug build checks integer overflow in the vendored emulator, which a release build does not (it wraps, as the hardware does): a garbage firmware jumping to the top of the address
# space panicked in `cargo test` (raw_garbage_and_wrong_sized_saves_are_refused_or_run_safely) and not in the shipped build. The tests now run the emulator as it ships.
[profile.dev.package.fm1-core]
overflow-checks = false
[profile.dev.package.fm1-soc]
overflow-checks = false

[profile.release]
opt-level = 3
panic = "abort"   # across the C API a panic must never unwind into C
