name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork pull requests get a read-only token and no secrets; say so explicitly.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck libsdl2-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Add the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - name: Run checks
        run: scripts/check.sh
      - name: Benchmark and regression gate
        # A shared runner is noisy: only a halving of core, screen or io figures fails (scripts/bench-gate.py). With no docs/bench-baseline-linux-x86_64.txt the gate
        # passes and says so; adopt the uploaded report as the baseline once, from a run on main.
        env:
          FM1NTT_DIR: ${{ runner.temp }}/fm1ntt-bench
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          mkdir -p "$FM1NTT_DIR"
          build/fm1ntt --bench --seconds 1
          python3 scripts/bench-gate.py docs/bench-baseline-linux-x86_64.txt "$FM1NTT_DIR/bench/latest.txt"
      - name: Keep the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-linux-x86_64
          path: ${{ runner.temp }}/fm1ntt-bench/bench/latest.txt
          if-no-files-found: ignore
  r36s:
    # The arm64 package, built and smoke-tested in Debian 12 under qemu (r36s/build-deb.sh); the same script the maintainer runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Build the package
        run: r36s/build-deb.sh
  linux:
    # The desktop Linux archive (scripts/build-linux.sh): Debian 12's glibc, SDL2 from the system, the permissive firmware, self-tested from the unpacked archive.
    # Kept as a run artifact; a release attaches it by hand, with the macOS zip.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the archive
        run: scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FM1-NTT-linux-x86_64
          path: build/linux/*.tar.gz
          if-no-files-found: error
  # CI builds Linux and the web; it never ships a Mac app (an unsigned one is "damaged" on any other Mac): releases are
  # signed and notarized on the maintainer's Mac.
